<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Colombia</title>
    <!-- Estilos de Bootstrap: Para no depender de CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <form id="formColombia">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="nombre" required>
        </div>

        <div class="mb-3">
            <label for="pais" class="form-label">País</label>
            <select class="form-select" id="pais" required>
                <option value="">Selecciona un país...</option>
                <option value="Colombia">Colombia</option>
                <option value="México">México</option>
                <option value="Argentina">Argentina</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="depto" class="form-label">Departamento</label>
            <select class="form-select" id="depto" required>
                <option value="">Selecciona un departamento...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="ciudad" class="form-label">Ciudad</label>
            <select class="form-select" id="ciudad" required>
                <option value="">Selecciona...</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Enviar</button>
    </form>


    <script src="/Ejercicios-Select-Dependiente-Y-Tabla/Script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></script>
</body>
</html>
