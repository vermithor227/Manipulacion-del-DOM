<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5 text-center">
    <div class="row gx-5" id="productos"></div>
</div>

<script>
    async function traerProductos() {
        const resultado = await fetch("./products.json");
        if (!resultado.ok) {
            throw new Error("Esto no fue epico papu");
        }
        const productos = await resultado.json();
        return productos;
    }

    async function iniciador() {
        const losProductos = await traerProductos();
        mostrarProductos(losProductos);
        console.log(losProductos);
    }

    function mostrarProductos(productos) {
        const contenedor = document.querySelector("#productos");
        contenedor.innerHTML = "";

        let carrito = localStorage.getItem("carritoSENA");
        try {
            carrito = carrito === null ? [] : JSON.parse(carrito);
            if (!Array.isArray(carrito)) carrito = [];
        } catch (error) {
            console.warn("Carrito corrupto en localStorage, se reinicia:", error);
            carrito = [];
        }

        productos.forEach(producto => {
            const columnaProducto = document.createElement("div");
            columnaProducto.classList.add("col-12", "col-sm-6", "col-md-3", "mb-4", "d-flex", "justify-content-center");

            columnaProducto.innerHTML = `
                <div class="card h-100 w-100 shadow-sm" data-id="${producto.id}" data-precio="${producto.precio}">
                    <img src="${producto.imagen}" class="card-img-top object-fit-cover" alt="${producto.nombre}" style="height: 180px;">
                    <div class="card-body d-flex flex-column justify-content-between text-center p-3">
                        <div>
                            <h6 class="card-title fw-bold mb-2">${producto.nombre}</h6>
                            <p class="card-text text-muted fw-semibold mb-3">$${producto.precio}</p>
                        </div>
                        <button class="btn btn-outline-info w-100 btn-comprar">Comprar</button>
                    </div>
                </div>
            `;

            contenedor.appendChild(columnaProducto);

            columnaProducto.addEventListener("click", function (evento) {
                if (!evento.target.closest(".btn-comprar")) return;

                const tarjeta = evento.target.closest('.card');
                if (!tarjeta) return;

                const productId = tarjeta.dataset.id;
                const precio = tarjeta.dataset.precio;

                const productoIndex = carrito.findIndex(item => item.id === productId);
                const productoExiste = productoIndex !== -1;

                if (productoExiste) {
                    alert("Producto: " + productId + " ya está en el carrito");
                    carrito[productoIndex].cantidad += 1;
                } else {
                    alert("Producto: " + productId + " agregado");
                    carrito.push({
                        id: productId,
                        cantidad: 1,
                        precio: precio
                    });
                }
                localStorage.setItem("carritoSENA", JSON.stringify(carrito));
            });
        });
    }

    iniciador();
</script>

</body>
</html>
